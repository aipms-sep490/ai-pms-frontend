<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PMS logo symbol">
  <defs>
    <linearGradient id="pmsAppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <filter id="pmsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C2D12" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#pmsAppGrad)" filter="url(#pmsShadow)" />
  <!-- Milestone progress bar on top -->
  <path d="M50 72 L102 56 L154 68 L206 48" fill="none" stroke="#FED7AA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="72" r="6" fill="#FEF08A" />
  <circle cx="102" cy="56" r="6" fill="#FEF08A" />
  <circle cx="154" cy="68" r="6" fill="#FEF08A" />
  <circle cx="206" cy="48" r="9" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3" />
  <!-- Bold PMS Typography -->
  <text x="128" y="156" font-family="'Plus Jakarta Sans', Inter, -apple-system, sans-serif" font-weight="900" font-size="80" letter-spacing="-3" text-anchor="middle" fill="#FFFFFF">PMS</text>
  <text x="128" y="196" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="15" letter-spacing="4" text-anchor="middle" fill="#FFEDD5">FPT UNIVERSITY</text>
</svg>
