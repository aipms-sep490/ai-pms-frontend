name: aipms-frontend

services:
  frontend:
    image: aipms-frontend:${AIPMS_FE_IMAGE_TAG:?Set the built frontend image tag}
    container_name: aipms-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5180:8080"
    networks: [tunnel]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    external: true
    name: go-exe_goexe-net
