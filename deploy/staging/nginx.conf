worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log query strings, which can contain authentication callback data.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /healthz { access_log off; return 200 'ok'; }
        location ~ /\. { deny all; }
        # Keep the public frontend compatible with relative API bundles and
        # preserve the same-origin Google binding cookie. Cloudflare has
        # already terminated TLS before the request reaches this container,
        # so the upstream API must receive an HTTPS forwarded scheme.
        location /api/ {
            proxy_pass https://api-staging.khaidz.com;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name api-staging.khaidz.com;
            proxy_set_header Host api-staging.khaidz.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            add_header Cache-Control 'no-store';
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            try_files $uri $uri/ /index.html;
        }
    }
}
