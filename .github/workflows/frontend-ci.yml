name: Frontend CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: 'Backend git ref for contract-drift verification'
        required: false
        default: 'develop'
      run_e2e_smoke:
        description: 'Run Playwright smoke E2E scaffold'
        required: false
        type: boolean
        default: false
  push:
    branches: [main, develop, 'feat/w*']

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aipms-sep490/ai-pms-backend
          ref: ${{ inputs.backend_ref || 'develop' }}
          path: backend-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-contracts.mjs check
        env:
          AI_PMS_BACKEND_DIR: backend-contracts
          AI_PMS_BACKEND_REF: HEAD
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: docker build -f deploy/staging/Dockerfile -t aipms-frontend:ci .
  e2e-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e-smoke')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:smoke:e2e
