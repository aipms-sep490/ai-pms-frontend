name: Frontend CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aipms-sep490/ai-pms-backend
          ref: develop
          path: backend-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-contracts.mjs check
        env:
          AI_PMS_BACKEND_DIR: backend-contracts
          AI_PMS_BACKEND_REF: HEAD
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
